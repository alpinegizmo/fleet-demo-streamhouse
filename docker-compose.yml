# Local fleet telemetry demo: Apache Kafka, Apache Flink, and the
# fleet-context-engine app, with AI recommendations from a local LLM served
# by Ollama on the host (not in a container, so it can use the Mac's GPU):
#
#   brew install ollama && brew services start ollama
#   ollama pull qwen2.5:3b
#
# Any other OpenAI-compatible server works too - set LLM_BASE_URL and
# LLM_MODEL.
#
# Flink also copies the derived topics into Apache Iceberg tables (RustFS
# object store + Iceberg REST catalog), queryable with DuckDB.
#
#   docker compose up --build        # then open http://localhost:8787 (or $APP_PORT)
#                                    # Flink UI: http://localhost:8081
#                                    # object store console: http://localhost:9001
#   docker compose run --rm duckdb   # SQL shell on the Iceberg tables
#   docker compose down -v           # stop and delete all data

name: fleet

x-topics: &topics
  # topic:partitions - must match ALL_TOPICS in fleet-context-engine/kafka-client.js
  TOPICS: >-
    vehicle.telemetry:3
    weather.conditions:1
    traffic.incidents:1
    parcel.volume:1
    maintenance.alerts:1
    driver.risk.events:1
    driver.risk.events.anomaly:1
    delivery.performance.events:1
    ai.maintenance.recommendations:1
    ai.safety.recommendations:1
    ai.delivery.recommendations:1

# Object store credentials - a local demo, so fixed and in the clear.
x-s3: &s3
  S3_ACCESS_KEY: fleet
  S3_SECRET_KEY: fleet-secret

x-flink: &flink
  build: local/flink
  image: fleet-flink:2.2.1
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Docker Desktop provides this; Linux needs it
  environment:
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    <<: *s3
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 2048m
      taskmanager.numberOfTaskSlots: 8
      parallelism.default: 1
      execution.checkpointing.interval: 30s
      execution.checkpointing.dir: file:///flink-data/checkpoints
  volumes:
    - flink-data:/flink-data
    - ./local/flink/sql:/opt/flink/sql:ro
    - ./local/flink/submit-jobs.sh:/opt/flink/bin/submit-jobs.sh:ro
    - ./local/flink/sql-shell.sh:/opt/flink/bin/sql-shell.sh:ro

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9094"   # host access: KAFKA_BOOTSTRAP=localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # the image defaults to /tmp, which a restart wipes
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    environment: *topics
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for spec in $$TOPICS; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # S3-compatible object store holding the Iceberg tables' data and
  # metadata files.
  objectstore:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (login: fleet / fleet-secret)
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: fleet
      RUSTFS_SECRET_KEY: fleet-secret
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the `warehouse` bucket (an S3 PUT, signed with curl's
  # built-in SigV4 support). 409 = it already exists.
  objectstore-init:
    image: curlimages/curl:8.22.0
    depends_on:
      objectstore: { condition: service_healthy }
    environment: *s3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://objectstore:9000/warehouse \
          --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY")
        echo "create bucket warehouse: HTTP $$code"
        [ "$$code" = 200 ] || [ "$$code" = 409 ]

  # Iceberg REST catalog: tracks each table's current metadata file. The
  # reference implementation from the Iceberg project, backed by SQLite on a
  # volume. Writes table metadata to the object store itself.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      objectstore-init: { condition: service_completed_successfully }
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://objectstore:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: fleet
      CATALOG_S3_SECRET__ACCESS__KEY: fleet-secret
      CATALOG_CLIENT_REGION: us-east-1
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalog:/tmp   # the image keeps its SQLite catalog in /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      - "8081:8081"   # Flink web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      flink-jobmanager: { condition: service_healthy }

  # One-shot: submits the SQL jobs in local/flink/sql (skipping any already
  # running). After editing a job:
  #   docker compose run --rm flink-sql-init submit-jobs.sh --replace
  flink-sql-init:
    <<: *flink
    command: submit-jobs.sh
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      iceberg-rest: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }

  seed:
    build: .
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    command: ["node", "seed.js"]

  fleet-app:
    build: .
    depends_on:
      seed: { condition: service_completed_successfully }
    ports:
      - "${APP_PORT:-8787}:8787"   # console, API, and MCP at /mcp; APP_PORT=... if 8787 is taken
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}   # for the /api/ask chat agent
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}   # also shown in the console
      # CHAT_MODEL: qwen2.5:7b   # a different model for the chat agent only
      ICEBERG_REST_URL: http://iceberg-rest:8181   # Behind the Scenes tab watches Iceberg commits
      # AUTO_TELEMETRY: "false"   # stop the continuous simulator
    restart: unless-stopped

  # SQL shell on the Iceberg tables; not started by `up`.
  #   docker compose run --rm duckdb
  duckdb:
    build: local/duckdb
    profiles: [tools]
    depends_on:
      iceberg-rest: { condition: service_healthy }

volumes:
  kafka-data:
  flink-data:
  objectstore-data:
  iceberg-catalog:
